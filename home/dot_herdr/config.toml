onboarding = false
# herdr configuration (defaults otherwise; see `herdr --default-config`)

[keys]
# Switch workspaces directly (tabs stay on the default prefix+1..9)
switch_workspace = "prefix+shift+1..9"

# Open the git-aware file viewer (herdr-file-viewer plugin) in a split pane
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "open file viewer"

# Toggle the code-review sidebar (persiyanov.reviewr plugin)
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

# lazygit をモーダル popup で開く(フォーカス中ペインの cwd のリポジトリ。閉じるとレイアウトは元のまま)
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "80%"
height = "80%"

# ghq のリポジトリを fzf で選んで新しいワークスペースで開く
[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = "sh ~/.config/herdr/scripts/ghq-workspace.sh"
description = "open ghq repo as workspace"
width = "60%"
height = "60%"

# ghq root 直下にリード用(横断タスク)ワークスペースを作る
[[keys.command]]
key = "prefix+shift+l"
type = "popup"
command = "sh ~/.config/herdr/scripts/lead-workspace.sh"
description = "new lead workspace at ghq root"
width = "50%"
height = "20%"

[ui]
show_agent_labels_on_pane_borders = false
# 新規タブの名前入力プロンプトを省略(リネームは prefix+shift+t)
prompt_new_tab_name = false

agent_panel_sort = "spaces"

# サイドバーのエージェント行を全種別共通で拡張(claude / codex など区別しない):
#   pane                   = 役割名(委譲したペインに付けた impl / review 等)
#   terminal_title_stripped = 作業内容
# トークンが解決できない行は herdr が行ごと省くので、報告しない種別でも空行にならない
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab", "pane"], ["terminal_title_stripped"], ["agent"]]

[ui.toast]
delivery = "herdr"

[experimental]
# ペイン内の画像描画(Ghostty は対応)
kitty_graphics = true
# prefix モード中は英数入力に自動切替(IME が日本語のままキーが効かない対策)
switch_ascii_input_source_in_prefix = true
# エージェントが隠すカーソルを IME 変換位置のために強制表示(claude/codex のペインのみ)
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex"]
